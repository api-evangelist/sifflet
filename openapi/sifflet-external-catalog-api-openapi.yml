openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend External Catalog API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: External Catalog
paths:
  /v1/external-catalog/import:
    post:
      description: 'Enriches existing Sifflet assets with metadata imported from an external data catalog. Each asset is processed independently. The caller must have "Catalog Editor" or "Domain Editor" permission on each asset''s domain.


        The HTTP status reflects the aggregate outcome: 200 when every asset succeeds, 207 when some succeed and some fail, 400 when all assets fail.'
      operationId: publicImportExternalCatalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicExternalCatalogImportDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExternalCatalogImportResponseDto'
          description: All assets imported successfully
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExternalCatalogImportResponseDto'
          description: Partial success - some assets imported, some failed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExternalCatalogImportResponseDto'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: 'Either the request failed validation or all assets failed to import '
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Push external catalog metadata to Sifflet assets
      tags:
      - External Catalog
components:
  schemas:
    ApiProblemSchema:
      type: object
      properties:
        detail:
          type: string
        response:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
    PublicExternalCatalogImportDto:
      required:
      - assets
      - configuration
      type: object
      properties:
        assets:
          type: array
          description: Assets to enrich with external catalog metadata
          items:
            $ref: '#/components/schemas/PublicAssetImportDto'
        configuration:
          $ref: '#/components/schemas/PublicConfigurationImportDto'
    PublicAssetImportResultDto:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: Failure message, present only when the asset failed to import
        status:
          type: string
          description: Import status of the asset
          enum:
          - SUCCESS
          - FAILED
        uri:
          type: string
          description: URI of the asset
          example: bigquery:project.dataset.table
      description: Per-asset import status
    PublicExternalCatalogImportResponseDto:
      type: object
      properties:
        detail:
          $ref: '#/components/schemas/PublicExternalCatalogImportResultDto'
        status:
          type: integer
          description: HTTP status code
          format: int32
        title:
          type: string
          description: HTTP status title
    PublicNamedElementExternalMetadataDto:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name to display
      description: Tags to attach to the asset
    PublicStringExternalMetadataDto:
      required:
      - data
      - name
      type: object
      properties:
        data:
          type: string
          description: Value of the metadata
        name:
          type: string
          description: Name of the metadata
        showInFilter:
          type: boolean
          description: Whether the metadata should be shown as a filter in the catalog
          default: false
      description: String metadata to attach to the asset
    PublicExternalCatalogImportResultDto:
      type: object
      properties:
        importStatus:
          type: string
          description: Status of the import
          enum:
          - SUCCESS
          - PARTIAL_SUCCESS
          - FAILURE
        results:
          type: array
          description: Per-asset import status
          items:
            $ref: '#/components/schemas/PublicAssetImportResultDto'
      description: Detailed import result
    PublicLabelExternalMetadataDto:
      required:
      - data
      - name
      type: object
      properties:
        data:
          type: array
          description: Values of the label
          items:
            $ref: '#/components/schemas/PublicNamedElementExternalMetadataDto'
        name:
          type: string
          description: Name of the metadata
        showInFilter:
          type: boolean
          description: Whether the label should be shown as a filter in the catalog
          default: false
      description: Labels to attach to the asset
    PublicAssetImportDto:
      required:
      - uri
      type: object
      properties:
        catalogUrl:
          type:
          - string
          - 'null'
          description: URL of the asset in the external catalog. Null or empty removes the existing link.
          example: https://catalog.example.com/asset/123
        description:
          type:
          - string
          - 'null'
          description: Description of the asset in the external catalog. Null or empty removes the existing description.
        labels:
          type: array
          description: Labels to attach to the asset
          items:
            $ref: '#/components/schemas/PublicLabelExternalMetadataDto'
        strings:
          type: array
          description: String metadata to attach to the asset
          items:
            $ref: '#/components/schemas/PublicStringExternalMetadataDto'
        tags:
          type: array
          description: Tags to attach to the asset
          items:
            $ref: '#/components/schemas/PublicNamedElementExternalMetadataDto'
        uri:
          type: string
          description: URI of the asset to enrich. <a href="https://docs.siffletdata.com/docs/uri">[Read more about URIs]</a>
          example: bigquery:project.dataset.table
      description: Assets to enrich with external catalog metadata
    PublicConfigurationImportDto:
      required:
      - catalogProvider
      type: object
      properties:
        catalogProvider:
          type: string
          description: Type of external catalog. If not listed, use CATALOG_GENERIC
          example: APACHE_ATLAS
          enum:
          - ATLAN
          - ALATION
          - AMUNDSEN
          - APACHE_ATLAS
          - CASTOR_DOC
          - COLLIBRA
          - DATAGALAXY
          - INFORMATICA
          - SECODA
          - SELECT_STAR
          - CATALOG_GENERIC
      description: Configuration of the import
  securitySchemes:
    JWT:
      bearerFormat: Bearer [token]
      description: JWT authentication with bearer token. [Create your access token through the UI](https://docs.siffletdata.com/docs/generate-an-api-token#create-an-api-token).
      scheme: bearer
      type: http
