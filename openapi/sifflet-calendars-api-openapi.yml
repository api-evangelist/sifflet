openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend Calendars API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: Calendars
paths:
  /v1/calendars:
    get:
      operationId: publicGetCalendars
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPageDtoPublicCalendarGetDto'
          description: Calendars retrieved
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get list of calendars
      tags:
      - Calendars
    post:
      operationId: publicCreateCalendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCalendarCreateDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCalendarGetDto'
          description: Calendar created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Create a calendar
      tags:
      - Calendars
  /v1/calendars/{id}:
    delete:
      operationId: publicDeleteCalendar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Calendar deleted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Delete a calendar
      tags:
      - Calendars
    get:
      operationId: publicGetCalendar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCalendarGetDto'
          description: Calendar retrieved
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get a calendar by id
      tags:
      - Calendars
    patch:
      operationId: publicUpdateCalendar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCalendarUpdateDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCalendarGetDto'
          description: Calendar updated
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Update a calendar
      tags:
      - Calendars
components:
  schemas:
    ApiProblemSchema:
      type: object
      properties:
        detail:
          type: string
        response:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
    PublicPageDtoPublicCalendarGetDto:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicCalendarGetDto'
        totalCount:
          type: integer
          format: int64
    PublicCalendarUpdateDto:
      required:
      - name
      - timeslots
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        timeslots:
          type: array
          items:
            $ref: '#/components/schemas/CalendarTimeslot'
    CalendarTimeslot:
      required:
      - date
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type:
          - string
          - 'null'
    PublicCalendarGetDto:
      required:
      - id
      - name
      - timeslots
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        editable:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
        standardCalendar:
          type:
          - string
          - 'null'
          enum:
          - US_PUBLIC_HOLIDAYS
          - FRANCE_PUBLIC_HOLIDAYS
          - UK_PUBLIC_HOLIDAYS
          - BELGIUM_PUBLIC_HOLIDAYS
          - SPAIN_PUBLIC_HOLIDAYS
          - GERMANY_PUBLIC_HOLIDAYS
          - NETHERLANDS_PUBLIC_HOLIDAYS
          - SUNDAYS
          - WEEKENDS
        timeslots:
          type: array
          items:
            $ref: '#/components/schemas/CalendarTimeslot'
    PublicCalendarCreateDto:
      required:
      - name
      - timeslots
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        timeslots:
          type: array
          items:
            $ref: '#/components/schemas/CalendarTimeslot'
  securitySchemes:
    JWT:
      bearerFormat: Bearer [token]
      description: JWT authentication with bearer token. [Create your access token through the UI](https://docs.siffletdata.com/docs/generate-an-api-token#create-an-api-token).
      scheme: bearer
      type: http
