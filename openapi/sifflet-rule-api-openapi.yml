components:
  schemas:
    GroupDecryptedValuesDto:
      type: object
      properties:
        decryptedValues:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CustomHeader:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    AlertingHookDto:
      required:
      - externalHook
      - id
      - name
      - type
      type: object
      properties:
        createdBy:
          type: string
        createdDate:
          type: integer
          format: int64
        externalHook:
          type: string
        id:
          type: string
          format: uuid
        lastModifiedDate:
          type: integer
          format: int64
        modifiedBy:
          type: string
        name:
          type: string
        params:
          oneOf:
          - $ref: '#/components/schemas/DefaultWebhookParams'
          - $ref: '#/components/schemas/GoogleChatWebhookParams'
        type:
          type: string
          enum:
          - SLACK
          - MAIL
          - MS_TEAMS
          - WEBHOOK
    TimeZoneDto:
      required:
      - timezone
      - utcOffset
      type: object
      properties:
        timezone:
          type: string
        utcOffset:
          type: string
    RuleStatusDto:
      required:
      - ruleStatus
      type: object
      properties:
        latestRunDate:
          type: integer
          format: int64
        ruleStatus:
          type: string
          enum:
          - NOT_EVALUATED
          - PASSING
          - NEEDS_ATTENTION
          - FAILING
    UserProviderDto:
      required:
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderDto'
      - type: object
        properties:
          name:
            type: string
    DatasourceProviderDto:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderDto'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
    RuleDetailsDto:
      required:
      - createdByProvider
      - mails
      - modifiedByProvider
      - msTeams
      - provider
      - slackChannels
      - tags
      - terms
      - webhooks
      type: object
      properties:
        createdBy:
          type:
          - string
          - 'null'
          deprecated: true
        createdByProvider:
          oneOf:
          - $ref: '#/components/schemas/AccessTokenProviderDto'
          - $ref: '#/components/schemas/DatasourceProviderDto'
          - $ref: '#/components/schemas/GenericProviderDto'
          - $ref: '#/components/schemas/UserProviderDto'
        createdDate:
          type:
          - integer
          - 'null'
          format: int64
        jiraTemplateName:
          type: string
        lastModifiedDate:
          type:
          - integer
          - 'null'
          format: int64
        mails:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
        modifiedBy:
          type:
          - string
          - 'null'
          deprecated: true
        modifiedByProvider:
          oneOf:
          - $ref: '#/components/schemas/AccessTokenProviderDto'
          - $ref: '#/components/schemas/DatasourceProviderDto'
          - $ref: '#/components/schemas/GenericProviderDto'
          - $ref: '#/components/schemas/UserProviderDto'
        msTeams:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
        provider:
          oneOf:
          - $ref: '#/components/schemas/AccessTokenProviderDto'
          - $ref: '#/components/schemas/DatasourceProviderDto'
          - $ref: '#/components/schemas/GenericProviderDto'
          - $ref: '#/components/schemas/UserProviderDto'
        ruleParams:
          $ref: '#/components/schemas/JsonNode'
        serviceNowTemplateName:
          type: string
        slackChannels:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
    ApiProblemSchema:
      type: object
      properties:
        detail:
          type: string
        response:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
    RuleInfoDto:
      required:
      - canBeQualified
      - canBeScheduled
      - canHaveFailingRows
      - canManuallyRun
      - criticality
      - id
      - name
      - readOnly
      - ruleLabel
      - ruleStatus
      - ruleTemplateName
      - sourcePlatform
      - supportAsCodeYAMLConversion
      - unresolvedIncidents
      type: object
      properties:
        canBeQualified:
          type: boolean
        canBeScheduled:
          type: boolean
        canHaveFailingRows:
          type: boolean
        canManuallyRun:
          type: boolean
        criticality:
          $ref: '#/components/schemas/Criticality'
        customMetadata:
          type: array
          items:
            $ref: '#/components/schemas/EntityCustomMetadataDto'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetBriefDto'
        id:
          type: string
          format: uuid
        lastIncident:
          $ref: '#/components/schemas/IncidentLightDto'
        lastRunStatus:
          type: string
          deprecated: true
          enum:
          - PENDING
          - RUNNING
          - SUCCESS
          - REQUIRES_YOUR_ATTENTION
          - TECHNICAL_ERROR
          - FAILED
        lastRunTimestamp:
          type: integer
          format: int64
        lastUnresolvedIncident:
          $ref: '#/components/schemas/IncidentLightDto'
        mails:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
        msTeams:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
        muted:
          type: boolean
        mutedUntil:
          type: integer
          format: int64
        mutingMode:
          type: string
          enum:
          - INDEFINITE
          - UNTIL_DATE
          - UNTIL_NEXT_STATUS_IMPROVES
          - NOT_MUTED
        name:
          type: string
        readOnly:
          type: boolean
        ruleLabel:
          type: string
        ruleStatus:
          type: string
          enum:
          - NOT_EVALUATED
          - PASSING
          - NEEDS_ATTENTION
          - FAILING
        ruleTemplateName:
          type: string
        schedule:
          type: string
        scheduleTimezone:
          $ref: '#/components/schemas/TimeZoneDto'
        slackChannels:
          type: array
          items:
            $ref: '#/components/schemas/AlertingHookDto'
        sourcePlatform:
          type: string
          enum:
          - SIFFLET
          - DBT
        supportAsCodeYAMLConversion:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        unresolvedIncidents:
          type: integer
          format: int32
        workspace:
          $ref: '#/components/schemas/WorkspaceSummaryDto'
    FilterElementDto:
      required:
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        results:
          type: integer
          format: int32
    RuleOverviewDto:
      type: object
      properties:
        description:
          type: string
    WorkspaceSummaryDto:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
    SearchCollectionRuleCatalogAssetDto:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RuleCatalogAssetDto'
        totalElements:
          type: integer
          format: int64
    RuleRunValuesDto:
      type: object
      properties:
        actual:
          type: number
          format: float
        expected:
          $ref: '#/components/schemas/RuleRunExpectedValuesDto'
    ProviderDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - GENERIC
          - DATASOURCE
          - USER
          - ACCESS_TOKEN
      discriminator:
        mapping:
          ACCESS_TOKEN: '#/components/schemas/AccessTokenProviderDto'
          DATASOURCE: '#/components/schemas/DatasourceProviderDto'
          GENERIC: '#/components/schemas/GenericProviderDto'
          USER: '#/components/schemas/UserProviderDto'
        propertyName: type
    AccessTokenProviderDto:
      required:
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderDto'
      - type: object
        properties:
          name:
            type: string
    GenericProviderDto:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderDto'
      - type: object
        properties:
          createdBy:
            type: string
    IncidentTeamDto:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DatasetBriefDto:
      required:
      - datasourceName
      - datasourceType
      - id
      - name
      - urn
      type: object
      properties:
        datasourceName:
          type: string
        datasourceType:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        urn:
          type: string
    EntityCustomMetadataDto:
      required:
      - entries
      - id
      - name
      - type
      type: object
      properties:
        description:
          type: string
        entries:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/EntityCustomMetadataEntryLabelDto'
            - $ref: '#/components/schemas/EntityCustomMetadataEntryStringDto'
            - $ref: '#/components/schemas/EntityCustomMetadataEntryTeamDto'
            - $ref: '#/components/schemas/EntityCustomMetadataEntryUserDto'
        id:
          type: string
          format: uuid
        lineagePlatform:
          type: string
          enum:
