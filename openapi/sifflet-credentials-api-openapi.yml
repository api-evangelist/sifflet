openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend Credentials API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: Credentials
paths:
  /v1/credentials:
    get:
      operationId: publicGetAllCredentials
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCredentialsPageDtoPublicCredentialsGetDto'
          description: Credentials retrieved
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Too many requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get list of credentials
      tags:
      - Credentials
    post:
      description: This operation is eventually consistent. If you create a secret and attempt to retrieve it immediately, the GET endpoint may return a NotFound response
      operationId: publicCreateCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCredentialsCreateDto'
        required: true
      responses:
        '201':
          description: Credentials created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Too many requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Create credentials
      tags:
      - Credentials
  /v1/credentials/{name}:
    delete:
      operationId: publicDeleteCredentials
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Credentials deleted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Too many requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Delete credentials
      tags:
      - Credentials
    get:
      operationId: publicGetCredentials
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCredentialsGetDto'
          description: Credentials retrieved
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Too many requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get credentials by name
      tags:
      - Credentials
    patch:
      operationId: publicUpdateCredentials
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCredentialsPatchDto'
        required: true
      responses:
        '204':
          description: Credentials updated
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Too many requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Update credentials
      tags:
      - Credentials
components:
  schemas:
    PublicCredentialsGetDto:
      required:
      - name
      type: object
      properties:
        description:
          type: string
          description: Description of credentials
        name:
          type: string
          description: Name of credentials
    PublicCredentialsPatchDto:
      type: object
      properties:
        description:
          type: string
          description: Description of credentials
          example: Credentials for Looker
        value:
          type: string
          description: Value of credentials. Double quotes must be escaped with a backslash.
          example: '{"user":"rmwEPZILBnEYLtJxEFea","password":"NoEGLWfNCMctymuJTYHMMeJt"}'
    ApiProblemSchema:
      type: object
      properties:
        detail:
          type: string
        response:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
    PublicCredentialsPageDtoPublicCredentialsGetDto:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicCredentialsGetDto'
        totalCount:
          type: integer
          description: Number of credentials on the account
          format: int64
    PublicCredentialsCreateDto:
      required:
      - name
      - value
      type: object
      properties:
        description:
          type: string
          description: Description of credentials
          example: Credentials for Looker
        name:
          pattern: ^[a-zA-Z][-a-zA-Z0-9]{0,125}[a-zA-Z]$
          type: string
          description: Name of credentials. Must start and end with a letter, and contain only letters, digits, and hyphens
          example: looker
        value:
          type: string
          description: Value of credentials. Double quotes must be escaped with a backslash.
          example: '{"user":"rmwEPZILBnEYLtJxEFea","password":"NoEGLWfNCMctymuJTYHMMeJt"}'
  securitySchemes:
    JWT:
      bearerFormat: Bearer [token]
      description: JWT authentication with bearer token. [Create your access token through the UI](https://docs.siffletdata.com/docs/generate-an-api-token#create-an-api-token).
      scheme: bearer
      type: http
