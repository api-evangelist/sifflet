aid: sifflet
name: Sifflet
description: >-
  Sifflet is a data observability platform positioned as the control plane for Data and AI.
  It catches data issues before they reach the business, traces them to their root cause, and
  helps teams fix them fast. The platform unifies a data catalog, data quality monitoring,
  end-to-end data lineage (including field-level lineage), built-in security and access
  control, and AI-powered agents (Sentinel auto-monitoring, Sage root-cause analysis, and an
  AI chat/assistant) into one product. It integrates with major data platforms and tools
  including Snowflake, Databricks, BigQuery, Amazon Redshift, dbt, Apache Airflow, Fivetran,
  Tableau, Looker, and Power BI. Developers automate Sifflet through a public REST API
  (Bearer Access Token auth), a Python CLI, a Terraform provider, Airflow operators, outbound
  webhooks, and an official MCP server. Sifflet is a portfolio company of EQT Ventures.
