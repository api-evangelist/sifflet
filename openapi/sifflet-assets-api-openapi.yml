openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend Assets API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: Assets
paths:
  /v1/assets:
    patch:
      operationId: publicEditAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUpdateAssetDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGetAssetDto'
          description: Asset edited
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Edit an asset
      tags:
      - Assets
  /v1/assets/get-asset-with-uri:
    post:
      operationId: publicGetAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicGetAssetRequestDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGetAssetDto'
          description: Asset retrieved
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get asset by uri
      tags:
      - Assets
  /v1/assets/search:
    post:
      operationId: publicGetAssets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAssetSearchCriteriaDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPageDtoPublicGetAssetListDto'
          description: Assets retrieved
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get search results for assets
      tags:
      - Assets
components:
  schemas:
    PublicTagReferenceDto:
      type: object
      properties:
        id:
          type: string
          description: Id of the referenced object
          format: uuid
        kind:
          type: string
          description: Type of the referenced tag
          enum:
          - TAG
          - CLASSIFICATION
        name:
          type: string
          description: Name of the referenced object
      description: Tags of the source. A tag can either be referenced by its id or its name or its name and kind.
      example:
      - id: 02a15477-1e58-490e-aa5c-1c7388fcb136
        name: PII
        kind: CLASSIFICATION
      - name: tag-name
      - name: PII
        kind: CLASSIFICATION
    PublicTransformationRunDto:
      type:
      - object
      - 'null'
      properties:
        lastRunDate:
          type: integer
          description: Last run date of the transformation
          format: int64
        lastRunStatus:
          type: string
          description: Last run status of the transformation
          enum:
          - SUCCESS
          - ERROR
          - SKIPPED
          - PARTIAL_SUCCESS
          - NOT_TARGETED
          - UNKNOWN
        type:
          type: string
          description: Type of the transformation
      description: Transformation associated to the asset
    PublicDomainGetDto:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      description: Domains of the asset
    PublicGetCustomMetadataEntryStringDto:
      required:
      - customMetadataName
      - stringValue
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/PublicGetCustomMetadataEntryDto'
      - type: object
        properties:
          stringValue:
            type: string
    PublicGetAssetDto:
      required:
      - domains
      - healthStatus
      - id
      - ingestionMethod
      - name
      - technology
      - type
      - uri
      - urn
      - usage
      type: object
      properties:
        columns:
          type: array
          description: Fields of the asset
          items:
            $ref: '#/components/schemas/PublicGetAssetColumnDto'
        customMetadataValues:
          type: array
          description: Custom metadata values of the asset
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicGetCustomMetadataEntryLabelDto'
            - $ref: '#/components/schemas/PublicGetCustomMetadataEntryStringDto'
            - $ref: '#/components/schemas/PublicGetCustomMetadataEntryTeamDto'
            - $ref: '#/components/schemas/PublicGetCustomMetadataEntryUserDto'
        description:
          type:
          - string
          - 'null'
          description: Description of the asset
        domains:
          type: array
          description: Domains of the asset
          items:
            $ref: '#/components/schemas/PublicDomainGetDto'
        externalDescriptions:
          type: array
          description: Descriptions of the asset from external providers
          items:
            $ref: '#/components/schemas/PublicDescriptionDto'
        externalTags:
          type: array
          description: Asset tags from external providers
          example:
          - id: 02a15477-1e58-490e-aa5c-1c7388fcb136
            kind: BIGQUERY_EXTERNAL
            name: env:prod
          items:
            $ref: '#/components/schemas/PublicExternalTagReferenceDto'
        externalTerms:
          type: array
          description: Business terms from external providers
          example:
          - id: 02a15477-1e58-490e-aa5c-1c7388fcb136
            kind: ATLAN_EXTERNAL
            name: Product
          items:
            $ref: '#/components/schemas/PublicExternalTermReferenceDto'
        healthStatus:
          type: string
          description: Asset health status
          enum:
          - URGENT_INCIDENTS
          - HIGH_RISK_INCIDENTS
          - NO_INCIDENTS
          - NOT_MONITORED
          - UNSUPPORTED
        id:
          type: string
          format: uuid
        ingestionMethod:
          type: string
          description: Ingestion method of the asset
          enum:
          - DECLARATIVE
          - SIFFLET_SOURCED
        name:
          type: string
          description: Name of the asset
        owners:
          type: array
          description: Owners of the asset
          example:
          - email: john.smith@example.com
            id: 01a15466-1e58-321e-bb5c-1c7388fcb222
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrEmailDto'
        tags:
          type: array
          description: Tags of the asset
          example:
          - id: 02a15477-1e58-490e-aa5c-1c7388fcb136
            kind: CLASSIFICATION
            name: PII
          items:
            $ref: '#/components/schemas/PublicTagReferenceDto'
