apis:
- name: Sifflet Public API
  description: >-
    Sifflet's public REST API for programmatically managing data observability resources —
    assets and workspaces, monitors/rules and rule runs, sources (V2), credentials, domains,
    calendars, notification rules, teams, and users. Endpoints are URI-versioned (/api/v2)
    and authenticated with a Bearer Access Token. All endpoints accept application/json and
    application/x-yaml. Base URL is per-tenant on SaaS (https://<tenant>.siffletdata.com) or
    the deployment host when self-hosted.
  humanURL: https://docs.siffletdata.com/reference/overview-1
  baseURL: https://demo.siffletdata.com/api/v2
