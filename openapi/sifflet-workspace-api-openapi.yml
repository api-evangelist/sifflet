openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend Workspace API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: Workspace
paths:
  /v1/rules/_all-as-code:
    get:
      description: Fetches monitors, converts each to its as-code representation, and returns them in a paginated list.
      operationId: getAllMonitorsAsCode
      parameters:
      - in: query
        name: mode
        required: false
        schema:
          type: string
          enum:
          - RELAXED
          - STRICT
          - EXPANDED
          default: RELAXED
      - description: Global text search
        in: query
        name: textSearch
        required: false
        schema:
          type: string
      - description: Filter on given rule template name
        in: query
        name: ruleTemplateName
        required: false
        schema:
          type: array
          items:
            type: string
      - deprecated: true
        description: Filter on given last run statuses
        in: query
        name: lastRunStatus
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - RUNNING
            - SUCCESS
            - REQUIRES_YOUR_ATTENTION
            - TECHNICAL_ERROR
            - FAILED
      - description: Filter on given rule status
        in: query
        name: ruleStatus
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NOT_EVALUATED
            - PASSING
            - NEEDS_ATTENTION
            - FAILING
      - description: Filter on given dataset ids
        in: query
        name: dataset
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - description: Filter on given tag ids
        in: query
        name: tag
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - description: Filter on given datasource ids
        in: query
        name: datasource
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - in: query
        name: criticality
        required: false
        schema:
          type: array
          items:
            maximum: 3
            minimum: 0
            type: integer
            format: int32
      - description: Domain searched
        in: query
        name: domain
        required: false
        schema:
          type: string
      - description: The requested page number. Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: The number of elements to be returned inside the page. Pass a value of -1, to bypass pagination and fetch all items
        in: query
        name: itemsPerPage
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - description: 'The resource fields on which to apply the sort, format : property,ASC|DESC'
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
            description: The resource field on which to apply the sort followed by the direction
            format: property,ASC|DESC
            example: name,ASC
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsCodeMonitorDto'
            application/x-yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsCodeMonitorDto'
          description: Successfully converted monitors to as-code
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Convert all monitors to as-code
      tags:
      - Workspace
components:
  schemas:
    AsCodeFieldFormatValidationClauseDto:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          enum:
          - Email
          - Phone
          - UUID
          - Regex
      discriminator:
        mapping:
          Email: '#/components/schemas/AsCodeFieldFormatValidationClauseDto'
          Phone: '#/components/schemas/AsCodeFieldFormatValidationClauseDto'
          Regex: '#/components/schemas/AsCodeRegexFieldFormatValidationClauseDto'
          UUID: '#/components/schemas/AsCodeFieldFormatValidationClauseDto'
        propertyName: kind
    AsCodeStaticFieldProfilingMonitorParamsDto:
      required:
      - field
      - profiling
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          field:
            type: array
            items:
              type: string
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          profiling:
            oneOf:
            - $ref: '#/components/schemas/AsCodeFieldProfilingClauseDto'
            - $ref: '#/components/schemas/AsCodeNullFieldProfilingClauseDto'
          threshold:
            $ref: '#/components/schemas/AsCodeStaticFieldProfilingThresholdDto'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV1'
          whereStatement:
            type: string
    AsCodePartitionClauseDto:
      type: object
      properties:
        kind:
          type: string
          enum:
          - IngestionTime
          - IntegerRange
          - TimeUnitColumn
      discriminator:
        mapping:
          IngestionTime: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
          IntegerRange: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
          TimeUnitColumn: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
        propertyName: kind
    NumberDto:
      type: object
      properties:
        floatValue:
          type: number
          format: float
        integer:
          type: boolean
        integerValue:
          type: integer
          format: int32
        zero:
          type: boolean
    AsCodeValueRangeMonitorParamsDto:
      required:
      - field
      - range
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          field:
            $ref: '#/components/schemas/AsCodeFieldReferenceDto'
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          range:
            $ref: '#/components/schemas/AsCodeRangeDto'
          threshold:
            oneOf:
            - $ref: '#/components/schemas/AsCodeDynamicThresholdDtoV2'
            - $ref: '#/components/schemas/AsCodeStaticThresholdDtoV2'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV2'
          whereStatement:
            type: string
    AsCodeAlertingHookNotificationDto:
      required:
      - kind
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeNotificationReferenceDto'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
    AsCodeVolumeMonitorParamsDto:
      required:
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          metadataBased:
            type: boolean
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          threshold:
            oneOf:
            - $ref: '#/components/schemas/AsCodeDynamicThresholdDtoV2'
            - $ref: '#/components/schemas/AsCodeStaticThresholdDtoV2'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV2'
          whereStatement:
            type: string
    AsCodeStaticFreshnessThresholdDto:
      required:
      - kind
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeFreshnessThresholdDto'
    AsCodeCustomMetricsMonitorParamsDtoV2:
      required:
      - sql
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          emptyMeansZero:
            type: boolean
          sql:
            type: string
          threshold:
            oneOf:
            - $ref: '#/components/schemas/AsCodeDynamicThresholdDtoV2'
            - $ref: '#/components/schemas/AsCodeStaticThresholdDtoV2'
          timeWindow:
            $ref: '#/components/schemas/AsCodeCustomMetricsTimeWindowDto'
    AsCodeJoinFieldPairDto:
      required:
      - leftField
      - rightField
      type: object
      properties:
        leftField:
          $ref: '#/components/schemas/AsCodeFieldReferenceDto'
        rightField:
          $ref: '#/components/schemas/AsCodeFieldReferenceDto'
    AsCodeNotificationReferenceDto:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          enum:
          - Slack
          - Email
          - MicrosoftTeams
          - Jira
          - ServiceNow
          - Webhook
      discriminator:
        mapping:
          Email: '#/components/schemas/AsCodeAlertingHookNotificationDto'
          Jira: '#/components/schemas/AsCodeJiraNotificationDto'
          MicrosoftTeams: '#/components/schemas/AsCodeAlertingHookNotificationDto'
          ServiceNow: '#/components/schemas/AsCodeServiceNowNotificationDto'
          Slack: '#/components/schemas/AsCodeAlertingHookNotificationDto'
          Webhook: '#/components/schemas/AsCodeAlertingHookNotificationDto'
        propertyName: kind
    AsCodeReferentialIntegrityRightDto:
      required:
      - field
      type: object
      properties:
        field:
          type: array
          items:
            type: string
        whereStatement:
          type: string
    AsCodeFieldUniquenessMonitorParamsDto:
      required:
      - field
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          field:
            type: array
            items:
              type: string
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV1'
          whereStatement:
            type: string
    AsCodeStaticThresholdDtoV1:
      type: object
      properties:
        excludedDates:
          type: array
          items:
            $ref: '#/components/schemas/AsCodeCalendarReferenceDto'
        isMaxInclusive:
          type: boolean
        isMinInclusive:
          type: boolean
        max:
          $ref: '#/components/schemas/NumberOrPercentageDto'
        min:
          $ref: '#/components/schemas/NumberOrPercentageDto'
    AsCodeConnectionParamsOverrideDto:
      required:
      - credentials
      type: object
      properties:
        credentials:
          type: string
    AsCodeIngestionTimePartitionClauseDto:
      required:
      - interval
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodePartitionClauseDto'
      - type: object
        properties:
          interval:
            $ref: '#/components/schemas/SimpleDuration'
    AsCodeTimeWindowWithOffsetFrequencyAndRollingClauseDto:
      required:
      - duration
      - field
      type: object
      properties:
        deltaQuerying:
          $ref: '#/components/schemas/SimpleDuration'
        disableDeltaQuerying:
          type: boolean
        duration:
          $ref: '#/components/schemas/SimpleDuration'
        field:
          type: string
        frequency:
          $ref: '#/components/schemas/SimpleDuration'
        offset:
          $ref: '#/components/schemas/SimpleDuration'
        rollingTimeWindow:
          $ref: '#/components/schemas/SimpleDuration'
    AsCodeThresholdBaseDto:
      required:
      - kind
      type: object
      properties:
        excludedDates:
          type: array
          items:
            $ref: '#/components/schemas/AsCodeCalendarReferenceDto'
        kind:
          type: string
          enum:
          - Static
          - Dynamic
        valueMode:
          type: string
          enum:
          - Count
          - Percentage
      discriminator:
        mapping:
          Dynamic: '#/components/schemas/AsCodeDynamicThresholdDtoV2'
          Static: '#/components/schemas/AsCodeStaticThresholdDtoV2'
        propertyName: kind
    AsCodeRangeDto:
      type: object
      properties:
        isMaxInclusive:
          type: boolean
        isMinInclusive:
          type: boolean
        max:
          $ref: '#/components/schemas/NumberDto'
        min:
          $ref: '#/components/schemas/NumberDto'
    AsCodeCalendarReferenceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        standardCalendar:
          type: string
          enum:
          - US_PUBLIC_HOLIDAYS
          - FRANCE_PUBLIC_HOLIDAYS
          - UK_PUBLIC_HOLIDAYS
          - BELGIUM_PUBLIC_HOLIDAYS
          - SPAIN_PUBLIC_HOLIDAYS
          - GERMANY_PUBLIC_HOLIDAYS
          - NETHERLANDS_PUBLIC_HOLIDAYS
          - SUNDAYS
          - WEEKENDS
    AsCodeDatasetReferenceDto:
      type: object
      properties:
        datasource:
          $ref: '#/components/schemas/AsCodeReferenceByIdOrNameDtoImpl'
        id:
          type: string
          format: uuid
        name:
          type: string
        uri:
          type: string
    AsCodeNumericComparisonConditionDto:
      required:
      - kind
      - leftExpression
      - rightExpression
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeConditionDto'
      - type: object
        properties:
          leftExpression:
            $ref: '#/components/schemas/AsCodeFieldExpressionDto'
          rightExpression:
            oneOf:
            - $ref: '#/components/schemas/AsCodeFieldExpressionDto'
            - $ref: '#/components/schemas/AsCodeValueExpressionDto'
    AsCodeAggregationClauseDtoV1:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          enum:
          - Average
          - NormalizedAverage
          - Count
          - DistinctCount
          - Sum
          - Max
          - Min
          - Quantile
          - Range
          - StandardDeviation
          - Variance
      discriminator:
        mapping:
          Average: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          Count: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          DistinctCount: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          Max: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          Min: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          NormalizedAverage: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          Quantile: '#/components/schemas/AsCodeQuantileAggregationClauseDtoV1'
          Range: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          StandardDeviation: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          Sum: '#/components/schemas/AsCodeAggregationClauseDtoV1'
          Variance: '#/components/schemas/AsCodeAggregationClauseDtoV1'
        propertyName: kind
    AsCodeFreshnessMonitorParamsDtoV1:
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          threshold:
            oneOf:
            - $ref: '#/components/schemas/AsCodeFreshnessThresholdDto'
            - $ref: '#/components/schemas/AsCodeDynamicFreshnessThresholdDto'
            - $ref: '#/components/schemas/AsCodeStaticFreshnessThresholdDto'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowWithOffsetFrequencyAndRollingClauseDto'
          whereStatement:
            type: string
    AsCodeFieldFormatMonitorParamsDtoV2:
      required:
      - field
      - format
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          field:
            $ref: '#/components/schemas/AsCodeFieldReferenceDto'
          format:
            oneOf:
            - $ref: '#/components/schemas/AsCodeFieldFormatValidationClauseDto'
            - $ref: '#/components/schemas/AsCodeRegexFieldFormatValidationClauseDto'
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          threshold:
            oneOf:
            - $ref: '#/components/schemas/AsCodeDynamicThresholdDtoV2'
            - $ref: '#/components/schemas/AsCodeStaticThresholdDtoV2'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV2'
          whereStatement:
            type: string
    AsCodeTimeWindowWithOffsetAndFrequencyClauseDto:
      required:
      - duration
      - field
      type: object
      properties:
        deltaQuerying:
          $ref: '#/components/schemas/SimpleDuration'
        disableDeltaQuerying:
          type: boolean
        duration:
          $ref: '#/components/schemas/SimpleDuration'
        field:
          type: string
        frequency:
          $ref: '#/components/schemas/SimpleDuration'
        offset:
          $ref: '#/components/schemas/SimpleDuration'
    SimpleDuration:
      type: object
      properties:
        unit:
          type: string
          enum:
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
          - WEEKS
          - MONTHS
          - YEARS
        value:
          type: integer
          format: int32
    AsCodeDistributionReferenceDto:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          enum:
          - Rolling
          - Fixed
      discriminator:
        mapping:
          Fixed: '#/components/schemas/AsCodeFixedDistributionReferenceDto'
          Rolling: '#/components/schemas/AsCodeRollingDistributionReferenceDto'
        propertyName: kind
    AsCodeTimeUnitColumnPartitionClauseDto:
      required:
      - field
      - interval
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodePartitionClauseDto'
      - type: object
        properties:
          field:
            $ref: '#/components/schemas/AsCodeFieldReferenceDto'
          interval:
            $ref: '#/components/schemas/SimpleDuration'
    AsCodeStaticMetricMonitorParamsDto:
      required:
      - aggregation
      - field
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          aggregation:
            oneOf:
            - $ref: '#/components/schemas/AsCodeAggregationClauseDtoV1'
            - $ref: '#/components/schemas/AsCodeQuantileAggregationClauseDtoV1'
          field:
            type: string
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          threshold:
            $ref: '#/components/schemas/AsCodeStaticThresholdDtoV1'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV1'
          whereStatement:
            type: string
    AsCodeFieldDuplicatesMonitorParamsDto:
      required:
      - field
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          field:
            type: array
            items:
              $ref: '#/components/schemas/AsCodeFieldReferenceDto'
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          threshold:
            oneOf:
            - $ref: '#/components/schemas/AsCodeDynamicThresholdDtoV2'
            - $ref: '#/components/schemas/AsCodeStaticThresholdDtoV2'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV2'
          whereStatement:
            type: string
    AsCodeFieldInListConstraintMonitorParamsDtoV1:
      required:
      - field
      - values
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          field:
            type: string
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV1'
          values:
            type: array
            items:
              type: string
          whereStatement:
            type: string
    AsCodeDurationDto:
      required:
      - timeUnit
      - value
      type: object
      properties:
        timeUnit:
          type: string
          enum:
          - days
          - hours
          - minutes
        value:
          type: integer
          format: int32
    AsCodeJoinConditionDto:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          enum:
          - Equality
      discriminator:
        propertyName: kind
    AsCodeStaticCompletenessMonitorParamsDto:
      required:
      - threshold
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          groupBy:
            $ref: '#/components/schemas/AsCodeGroupByClauseDto'
          partition:
            oneOf:
            - $ref: '#/components/schemas/AsCodeIngestionTimePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeIntegerRangePartitionClauseDto'
            - $ref: '#/components/schemas/AsCodeTimeUnitColumnPartitionClauseDto'
          threshold:
            $ref: '#/components/schemas/AsCodeStaticThresholdWithComparisonModeDto'
          timeWindow:
            $ref: '#/components/schemas/AsCodeTimeWindowClauseDtoV1'
          whereStatement:
            type: string
    AsCodeMetadataFreshnessMonitorParamsDtoV1:
      type: object
      allOf:
      - $ref: '#/components/schemas/AsCodeMonitorParamsDto'
      - type: object
        properties:
          threshold:
            $ref: '#/components/schemas/AsCodeDynamicFreshnessThresholdDto'
    AsCodeTimeWindowClauseDtoV2:
      required:
      - field
      type: object
      properties:
        deltaQuerying:
          $ref: '#/components/schemas/SimpleDuration'
        field:
          $ref: '#/components/schemas/AsCodeFieldReferenceDto'
        firstRun:
          $ref: '#/components/schemas/SimpleDuration'
        frequency:
          $ref: '#/components/schemas/SimpleDuration'
        offset:
          $ref: '#/components/schemas/SimpleDuration'
        offsetPeriods:
          type: integer
          format: int32
        rollingTimeWindow:
          $ref: '#/components/schemas/SimpleDuration'
    AsCodeReferentialIntegrityLeftDtoV1:
      required:
      - field
      type: object
      properties:
