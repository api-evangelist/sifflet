openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend Teams API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: Teams
paths:
  /v1/teams:
    get:
      operationId: publicGetTeams
      parameters:
      - description: The page number to retrieve. Starts at 0.
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
      - description: The number of elements to be returned inside the page.
        in: query
        name: itemsPerPage
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPageDtoPublicGetTeamDto'
          description: Teams retrieved
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get list of teams
      tags:
      - Teams
    post:
      operationId: publicCreateTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCreateTeamDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGetTeamDto'
          description: Team created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Create a team
      tags:
      - Teams
  /v1/teams/{id}:
    delete:
      operationId: publicDeleteTeam
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Team deleted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Delete a team
      tags:
      - Teams
    get:
      operationId: publicGetTeam
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGetTeamDto'
          description: Team retrieved
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get a team by id
      tags:
      - Teams
    patch:
      operationId: publicUpdateTeam
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUpdateTeamDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGetTeamDto'
          description: Team updated
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Update a team
      tags:
      - Teams
components:
  schemas:
    ApiProblemSchema:
      type: object
      properties:
        detail:
          type: string
        response:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
    PublicTeamPermissionAssignmentDto:
      required:
      - domainId
      - domainRole
      type: object
      properties:
        domainId:
          type: string
          description: Id of the domain
          format: uuid
        domainRole:
          type: string
          description: Domain role assigned to the team for accessing the referenced domain
          enum:
          - EDITOR
          - MONITOR_RESPONDER
          - CATALOG_EDITOR
          - VIEWER
      description: Domains permissions granted to the team
    PublicReferenceByIdOrEmailDto:
      type: object
      properties:
        email:
          type: string
          description: Email of the referenced owner
        id:
          type: string
          description: Id of the referenced owner
          format: uuid
      description: Id or email reference to an owner
    PublicUpdateTeamDto:
      required:
      - name
      type: object
      properties:
        description:
          type: string
          description: Description of the team
        domainPermissions:
          type: array
          description: Domains permissions granted to the team
          items:
            $ref: '#/components/schemas/PublicTeamPermissionAssignmentDto'
        name:
          type: string
          description: Name of the team
        users:
          type: array
          description: Users belonging to the team
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrEmailDto'
    PublicPageDtoPublicGetTeamDto:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicGetTeamDto'
        totalCount:
          type: integer
          format: int64
    PublicGetTeamDto:
      required:
      - id
      - name
      type: object
      properties:
        description:
          type: string
          description: Description of the team
        domainPermissions:
          type: array
          description: Domains permissions granted to the team
          items:
            $ref: '#/components/schemas/PublicTeamPermissionAssignmentDto'
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of the team
        users:
          type: array
          description: Users belonging to the team
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrEmailDto'
    PublicCreateTeamDto:
      required:
      - name
      type: object
      properties:
        description:
          type: string
          description: Description of the team
        domainPermissions:
          type: array
          description: Domains permissions granted to the team
          items:
            $ref: '#/components/schemas/PublicTeamPermissionAssignmentDto'
        name:
          type: string
          description: Name of the team
        users:
          type: array
          description: Users belonging to the team
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrEmailDto'
  securitySchemes:
    JWT:
      bearerFormat: Bearer [token]
      description: JWT authentication with bearer token. [Create your access token through the UI](https://docs.siffletdata.com/docs/generate-an-api-token#create-an-api-token).
      scheme: bearer
      type: http
