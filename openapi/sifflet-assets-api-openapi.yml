    PublicAssetSearchCriteriaDto:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/PublicAssetFilterDto'
        pagination:
          $ref: '#/components/schemas/PublicAssetPaginationDto'
        sort:
          type: array
          description: Sort to apply on the assets search. Possible values for field are 'name' and 'relevance'
          example:
          - direction: ASC
            field: name
          items:
            type: string
            description: The resource field on which to apply the sort followed by the direction
            format: property,ASC|DESC
            example: name,ASC
    PublicGetCustomMetadataEntryTeamDto:
      required:
      - customMetadataName
      - name
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/PublicGetCustomMetadataEntryDto'
      - type: object
        properties:
          name:
            type: string
    PublicUpdateAssetDto:
      required:
      - uri
      type: object
      properties:
        columns:
          type: array
          description: Fields of the asset
          items:
            $ref: '#/components/schemas/PublicUpdateAssetColumnDto'
        customMetadataValues:
          type: array
          description: Custom metadata entries of the asset
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicCustomMetadataEntryLabelReferenceDto'
            - $ref: '#/components/schemas/PublicCustomMetadataEntryStringReferenceDto'
            - $ref: '#/components/schemas/PublicCustomMetadataEntryTeamReferenceDto'
            - $ref: '#/components/schemas/PublicCustomMetadataEntryUserReferenceDto'
        description:
          type: string
          description: Description of the asset
        owners:
          type: array
          description: Owners of the asset
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrEmailDto'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PublicTagReferenceDto'
        terms:
          type: array
          description: Terms of the asset
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrNameDto'
        uri:
          type: string
          description: URI string identifying the asset. <a href="https://docs.siffletdata.com/docs/uri">[Read more about URIs]</a>
    PublicCustomMetadataEntryStringReferenceDto:
      required:
      - customMetadataName
      - stringValue
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/PublicCustomMetadataEntryReferenceDto'
      - type: object
        properties:
          stringValue:
            type: string
            description: Value of the referenced custom metadata string
    PublicCustomMetadataEntryReferenceDto:
      required:
      - customMetadataName
      - type
      type: object
      properties:
