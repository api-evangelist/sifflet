          - id: 02a15466-1e58-321e-aa5c-1c7388fcb136
            name: Product
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrNameDto'
        type:
          type: string
          description: Type of the field
      description: Fields of the asset
    PublicAssetFilterDto:
      type: object
      properties:
        assetType:
          type: array
          description: 'List of asset types to filter on. Valid values are TABLE_AND_VIEW, PIPELINE, DASHBOARD, ML_MODEL. For filtering declared assets with custom types, you can use the format declared-asset_{custom sub type}. For example: declared-asset_Storage'
          items:
            type: string
            description: 'List of asset types to filter on. Valid values are TABLE_AND_VIEW, PIPELINE, DASHBOARD, ML_MODEL. For filtering declared assets with custom types, you can use the format declared-asset_{custom sub type}. For example: declared-asset_Storage'
        customMetadataValues:
          type: array
          description: List of custom metadata values to filter on
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicCustomMetadataEntryLabelReferenceDto'
            - $ref: '#/components/schemas/PublicCustomMetadataEntryStringReferenceDto'
            - $ref: '#/components/schemas/PublicCustomMetadataEntryTeamReferenceDto'
            - $ref: '#/components/schemas/PublicCustomMetadataEntryUserReferenceDto'
        domainId:
          type: string
          description: Domain to search on
          format: uuid
        externalTerms:
          type: array
          description: List of external business terms to filter on
          items:
            $ref: '#/components/schemas/PublicExternalTermReferenceDto'
        healthStatus:
          type: array
          description: List of health status to filter on
          items:
            type: string
            description: List of health status to filter on
            enum:
            - URGENT_INCIDENTS
            - HIGH_RISK_INCIDENTS
            - NO_INCIDENTS
            - NOT_MONITORED
            - UNSUPPORTED
        ingestionMethod:
          type: array
          description: List of ingestion methods to filter on
          items:
            type: string
            description: List of ingestion methods to filter on
            enum:
            - DECLARATIVE
            - SIFFLET_SOURCED
        levelOfUsage:
          type: array
          description: List of usage qualifications to filter on
          items:
            type: string
            description: List of usage qualifications to filter on
            enum:
            - UNSUPPORTED
            - LOW
            - MEDIUM
            - HIGH
        owners:
          type: array
          description: List of owners to filter on
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrEmailDto'
        sourceId:
          type: array
          description: List of subSources to filter on by id. You should prefer using `subSourceUri` filter, and `subSourceUri` filter will be considered in priority if both of those filters are used.
          items:
            type: string
            description: List of subSources to filter on by id. You should prefer using `subSourceUri` filter, and `subSourceUri` filter will be considered in priority if both of those filters are used.
            format: uuid
        subSourceUri:
          type: array
          description: List of subSources to filter on by subSource uri. SubSources uri for a given source can be fetched using <a href="https://docs.siffletdata.com/reference/publicgetsourceschemalist">[the list sub-sources endpoint]</a>
          items:
            type: string
            description: List of subSources to filter on by subSource uri. SubSources uri for a given source can be fetched using <a href="https://docs.siffletdata.com/reference/publicgetsourceschemalist">[the list sub-sources endpoint]</a>
        tags:
          type: array
          description: List of tags to filter on
          items:
            $ref: '#/components/schemas/PublicTagReferenceDto'
        terms:
          type: array
          description: List of business terms to filter on
          items:
            $ref: '#/components/schemas/PublicReferenceByIdOrNameDto'
        textSearch:
          type: string
          description: Text to match in the asset names
      description: Filter to apply on the assets search
