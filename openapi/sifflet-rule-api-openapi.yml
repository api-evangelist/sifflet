openapi: 3.2.0
info:
  description: 'Requirements:

    - Create your access token through the UI

    - Get your tenant name: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`'
  title: Sifflet Backend Rule API
  version: 1.0.0
servers:
- url: https://{tenant}.siffletdata.com/api
  description: Production tenant
  variables:
    tenant:
      description: if you access to Sifflet with `https://abcdef.siffletdata.com`, then your tenant would be `abcdef`
      default: publicdemo
- url: http://localhost:8090
  description: Dev server started in intellij
- url: http://localhost:8091
  description: Dev server started in docker compose
- url: http://localhost:8099
  description: Dev server started with api recorder
tags:
- name: Rule
paths:
  /v1/rules:
    get:
      operationId: getAllRule
      parameters:
      - description: Global text search
        in: query
        name: textSearch
        required: false
        schema:
          type: string
      - description: Filter on given rule template name
        in: query
        name: ruleTemplateName
        required: false
        schema:
          type: array
          items:
            type: string
      - deprecated: true
        description: Filter on given last run statuses
        in: query
        name: lastRunStatus
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - RUNNING
            - SUCCESS
            - REQUIRES_YOUR_ATTENTION
            - TECHNICAL_ERROR
            - FAILED
      - description: Filter on given rule status
        in: query
        name: ruleStatus
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NOT_EVALUATED
            - PASSING
            - NEEDS_ATTENTION
            - FAILING
      - description: Filter on given dataset ids
        in: query
        name: dataset
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - description: Filter on given tag ids
        in: query
        name: tag
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - description: Filter on given datasource ids
        in: query
        name: datasource
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - in: query
        name: criticality
        required: false
        schema:
          type: array
          items:
            maximum: 3
            minimum: 0
            type: integer
            format: int32
      - description: Domain searched
        in: query
        name: domain
        required: false
        schema:
          type: string
      - description: The requested page number. Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: The number of elements to be returned inside the page. Pass a value of -1, to bypass pagination and fetch all items
        in: query
        name: itemsPerPage
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - description: 'The resource fields on which to apply the sort, format : property,ASC|DESC'
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
            description: The resource field on which to apply the sort followed by the direction
            format: property,ASC|DESC
            example: name,ASC
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSearchDto'
          description: Successfully fetch all rule catalog assets
        '206':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSearchDto'
          description: Successfully fetch partial content of rule catalog assets
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get all Sifflet rules
      tags:
      - Rule
  /v1/rules/{id}/_run:
    post:
      operationId: siffletRuleManualRun
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRunDto'
          description: Successfully trigger Sifflet rule manual run
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Trigger a run of the given Sifflet rule id
      tags:
      - Rule
  /v1/rules/{id}/decrypt:
    get:
      operationId: decryptRuleGroups
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDecryptedValuesDto'
          description: Successfully fetch rule groups decryption
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Decrypt rule groups
      tags:
      - Rule
  /v1/rules/{id}/details:
    get:
      operationId: getSiffletRuleDetails
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDetailsDto'
          description: Successfully fetch rule details
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get Sifflet rule details by rule id
      tags:
      - Rule
  /v1/rules/{id}/info:
    get:
      operationId: getSiffletRuleInfo
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleInfoDto'
          description: Successfully fetch rule info
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Internal server error
      security:
      - JWT: []
      summary: Get Sifflet rule information by rule id
      tags:
      - Rule
  /v1/rules/{id}/overview:
    get:
      operationId: getSiffletRuleOverview
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOverviewDto'
          description: Successfully fetch rule overview
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Bad request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Resource not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemSchema'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
