        mapping:
          LABEL: '#/components/schemas/PublicCustomMetadataEntryLabelReferenceDto'
          STRING: '#/components/schemas/PublicCustomMetadataEntryStringReferenceDto'
          TEAM: '#/components/schemas/PublicCustomMetadataEntryTeamReferenceDto'
          USER: '#/components/schemas/PublicCustomMetadataEntryUserReferenceDto'
        propertyName: type
